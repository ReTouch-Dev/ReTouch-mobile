name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci --coverage --coverageReporters=text-summary

  export-check:
    name: Expo export dry-run
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export (web, dry-run)
        run: npx expo export --platform web --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:5000
          EXPO_PUBLIC_ANALYTICS_BASE_URL: http://localhost:5002/analytics
